<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08112a">
  <title>{% block title %}Bridge Bank{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/da.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ app_version }}">
</head>
<body class="has-sidebar page-{{ active or 'app' }}">
  <main class="app-shell">
    <aside class="sidebar">
      <a class="logo" href="/">
        <img src="/static/da.png" alt="">
        <span class="logo-name">Bridge Bank</span>
      </a>
      <nav class="sidebar-nav">
        <a href="/setup" {% if active == 'license' %}class="active"{% endif %}>License</a>
        <a href="/setup/actual" {% if active == 'actual' %}class="active"{% endif %}>Actual Budget</a>
        <a href="/setup/notifications" {% if active == 'notifications' %}class="active"{% endif %}>Notifications</a>
        <a href="/bank" {% if active == 'bank' %}class="active"{% endif %}>Bank</a>
        <a href="/status" {% if active == 'status' %}class="active"{% endif %}>Status{% if nav_health %}<span class="health-dot {{ 'bad' if nav_health == 'bad' }}" title="{{ 'An account failed on the last sync' if nav_health == 'bad' else 'Last sync went fine' }}"></span>{% endif %}</a>
      </nav>
      <div class="sidebar-footer">
        <a href="mailto:support@david-alves.com">Support</a>
        <a href="https://bridgebank.app/privacy" target="_blank">Privacy</a>
        <a href="https://bridgebank.app/terms" target="_blank">Terms</a>
        <a href="https://github.com/DAdjadj/bridge-bank" target="_blank">GitHub</a>
        <span class="ver">v{{ app_version }}</span>
      </div>
    </aside>

    <section class="main-content">
      <div class="wrap">
        <div class="dashboard-surface">
          {% block steps %}{% endblock %}
          {% block content %}{% endblock %}
        </div>
      </div>
    </section>
  </main>
<script>
(function(){var tz=Intl.DateTimeFormat().resolvedOptions().timeZone;if(tz)fetch('/api/timezone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tz:tz})});})();
(function(){var a=document.querySelector('.sidebar-nav a.active');if(a&&window.innerWidth<=900&&a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'center'});})();
</script>
</body>
</html>
